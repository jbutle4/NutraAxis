<!--
  Related products (managed per product in ACCS Admin → Related Products).

  Paste into a DA html-loader block on the product page (for example, below
  the pdp-enrichment block in enrichment/pdp/{sku}). The script reads the SKU
  from the page URL and shows the Related Products entered in the Commerce
  Admin under the heading "Frequently Bought Together".

  To also show up-sells / cross-sells later, set data-link-types:
    <div id="pdp-related-products" data-link-types="related,upsell,crosssell"></div>

  To change the heading:
    <div id="pdp-related-products" data-heading-related="You May Also Like"></div>
-->
<div id="pdp-related-products"></div>
<script src="https://nutraaxisweb.azurewebsites.net/pdp-enrichment/pdp-related-products-dynamic.js?v=2"></script>
