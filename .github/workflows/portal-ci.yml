name: Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  nav-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Portal navigation audit
        run: php scripts/audit-portal-nav.php
